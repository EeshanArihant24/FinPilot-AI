services:
  postgres:
    image: postgres:14
    container_name: finpilot-db
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  banking-service:
    build: ./banking-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ai-service
